const IC=['🍽️','💍','🍼','👰','🥂','🎂','🏡','🌸','🏢','💒'],bg=u=>u?`background-image:url(${u})`:'';
function lb(k,j){$('#lbi').src=PH.get(k)[j];$('#m-lb').classList.add('on')}
function shrink(f){return new Promise(r=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const w=Math.min(800,im.width),c=document.createElement('canvas');c.width=w;c.height=im.height*w/im.width;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};im.onerror=()=>r(null);im.src=u})}
async function up(k,fl){if(!fl[0])return;const d=await shrink(fl[0]);if(d&&PH.set(k,d)){render();admin()}else alert('No se pudo guardar (archivo inválido o espacio lleno)')}
async function upg(k,fl){const a=PH.get(k)||[];for(const f of fl){const d=await shrink(f);if(d)a.push(d)}if(PH.set(k,a)){render();admin()}else alert('Espacio lleno: sube menos fotos o vacía la galería')}
function rm1(k){PH.set(k,null);render();admin()}
function photosUI(){const row=(lab,k)=>`<tr><td>${lab}</td><td><input type="file" accept="image/*" onchange="up('${k}',this.files)"></td><td>${PH.get(k)?`<span class="ok">✔</span> <button onclick="rm1('${k}')">Quitar</button>`:''}</td></tr>`;
 const g=(lab,k)=>`<p>${lab} (${(PH.get(k)||[]).length}): <input type="file" accept="image/*" multiple onchange="upg('${k}',this.files)"> <button onclick="rm1('${k}')">Vaciar</button></p>`;
 return '<p>Sube tus fotos reales; se reducen automáticamente y se guardan en este navegador.</p><table>'+row('Portada (hero)','hero')+svc().map((s,i)=>row(E(s.es),'s'+i)).join('')+'</table><h3>Galería</h3>'+g('Moodboards de Inspiración','mood')+g('Proyectos Oficiales de AM JOY','proj')}
let tab='ov';
function admin(){const o=$('#aout');let pw=S.get('pw',null);
 if(!pw){o.innerHTML='<p>Crea tu contraseña de administrador (se guarda solo en este navegador):</p><form id="ap"><input type="password" name="p" required minlength="6"><button class="p">Crear</button></form>';$('#ap').onsubmit=e=>{e.preventDefault();S.set('pw',btoa(unescape(encodeURIComponent(fd(e.target).p))));sessionStorage.amj=1;admin()};return}
 if(!sessionStorage.amj){o.innerHTML='<form id="al"><input type="password" name="p" required><button class="p">Entrar</button></form>';$('#al').onsubmit=e=>{e.preventDefault();if(btoa(unescape(encodeURIComponent(fd(e.target).p)))==pw){sessionStorage.amj=1;admin()}else alert('Incorrecto')};return}
 const q=S.get('q',[]),rv=S.get('rev',[]),L=['Nuevo','Calificado','Cotización Enviada','Ganado','Perdido'];
 const tabs=[['ov','Overview'],['ld','Leads'],['qs','Cotizaciones'],['rv','Reseñas'],['cm','Servicios/Precios'],['lg','Auditoría'],['ph','Fotos']];
 let h='<div class="tabs">'+tabs.map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';admin()">${a[1]}</button>`).join('')+'</div>';
 if(tab=='ov')h+=`<div class="kpi"><div><b>${q.length}</b>Cotizaciones</div><div><b>${q.filter(x=>x.lead=='Nuevo').length}</b>Leads nuevos</div><div><b>${q.filter(x=>x.appr).length}</b>Aprobadas</div><div><b>${rv.filter(r=>r.st=='pending').length}</b>Reseñas pendientes</div></div><p>Solo datos reales registrados. Vacío = sin actividad.</p>`;
 if(tab=='ld')h+='<div class="scroll"><table><tr>'+L.map(l=>`<th>${l}</th>`).join('')+'</tr><tr>'+L.map(l=>`<td style="vertical-align:top">${q.filter(x=>x.lead==l).map(x=>`<div class="card" style="padding:8px;margin-bottom:6px">${x.code}<br>${E(x.n)}<select onchange="mv('${x.code}',this.value)">${L.map(z=>`<option ${z==x.lead?'selected':''}>${z}</option>`).join('')}</select></div>`).join('')}</td>`).join('')+'</tr></table></div>';
 if(tab=='qs')h+='<div class="scroll"><table><tr><th>Código</th><th>Cliente</th><th>Evento</th><th>Fecha</th><th>Contacto</th><th>Estado</th><th>Total USD</th><th>% inicial (mín 50)</th><th>% final (máx 10)</th><th>2.º pago</th></tr>'+q.map(x=>`<tr><td>${x.code}</td><td>${E(x.n)}</td><td>${E(x.t)}</td><td>${E(x.f)}</td><td>${E(x.e)} · ${E(x.w)}</td><td>${x.appr?'Aprobada':x.lead}</td><td><input type="number" style="width:90px" value="${x.tot||''}" onchange="qe('${x.code}','tot',this.value)"></td><td><input type="number" style="width:60px" value="${x.p1||50}" onchange="qe('${x.code}','p1',this.value)"></td><td><input type="number" style="width:60px" value="${x.p3==null?10:x.p3}" onchange="qe('${x.code}','p3',this.value)"></td><td><input type="date" value="${x.d2||''}" onchange="qe('${x.code}','d2',this.value)"></td></tr>`).join('')+'</table></div>';
 if(tab=='rv')h+=rv.map(r=>`<div class="card" style="margin-bottom:8px">${'★'.repeat(r.s)} ${E(r.n)} (${E(r.l)}): ${E(r.c)}<br><b>${r.st}</b> <button onclick="rs(${r.id},'ok')">Aprobar</button> <button onclick="rs(${r.id},'no')">Rechazar</button></div>`).join('')||'<p>Sin reseñas.</p>';
 if(tab=='cm')h+=`<p>Tasa USD→DOP: <input type="number" value="${rate}" style="width:90px" onchange="rate=+this.value;S.set('rate',rate);render()"></p><table>`+svc().map((s,i)=>`<tr><td>${E(s.es)}</td><td><input type="number" value="${s.p}" onchange="sp(${i},this.value)"></td></tr>`).join('')+'</table>';
 if(tab=='ph')h+=photosUI();
 if(tab=='lg')h+='<ul>'+S.get('log',[]).map(l=>`<li>${E(l)}</li>`).join('')+'</ul>';
 o.innerHTML=h}
function plan(x){if(!x.tot)return '';const p1=x.p1||50,p3=x.p3==null?10:x.p3,p2=100-p1-p3,m=v=>$m(x.tot*v/100),d=new Date(x.f+'T00:00:00');d.setDate(d.getDate()-2);const d3=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 return `<table><tr><th>Pago</th><th>%</th><th>Monto</th><th>Fecha</th></tr><tr><td>1.º (reserva)</td><td>${p1}%</td><td>${m(p1)}</td><td>Al aprobar</td></tr><tr><td>2.º (saldo)</td><td>${p2}%</td><td>${m(p2)}</td><td>${x.d2||'Por definir'}</td></tr><tr><td>Final</td><td>${p3}%</td><td>${m(p3)}</td><td>${d3} (2 días antes)</td></tr></table>`}
function qe(c,f,v){const q=S.get('q',[]);q.forEach(x=>{if(x.code!=c)return;if(f=='d2')x.d2=v;else{v=Math.max(0,+v);if(f=='tot')x.tot=v;if(f=='p3')x.p3=Math.min(10,v);if(f=='p1')x.p1=Math.max(50,v)}const a=x.p1||50,b=x.p3==null?10:x.p3;if(a+b>100)x.p1=100-b});S.set('q',q);const g=S.get('log',[]);g.push(new Date().toISOString()+' · '+c+' plan de pago: '+f+'='+v);S.set('log',g);admin()}
function mv(c,l){const q=S.get('q',[]);q.forEach(x=>{if(x.code==c)x.lead=l});S.set('q',q);const g=S.get('log',[]);g.push(new Date().toISOString()+' · '+c+' → '+l);S.set('log',g);admin()}
function rs(id,st){const r=S.get('rev',[]);r.forEach(x=>{if(x.id==id)x.st=st});S.set('rev',r);admin();render()}
function sp(i,v){const s=svc();s[i].p=+v;S.set('svc',s);render()}
render();
</script></body></html>
